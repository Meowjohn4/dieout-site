.logo:hover::after{animation:gl .5s steps(2) 1}
@keyframes gl{0%{opacity:.85;transform:translate(-7px,2px)}50%{opacity:.6;transform:translate(6px,-2px)}100%{opacity:0;transform:none}}
@keyframes pop{from{opacity:0;scale:1.07}}
.soon{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:.9em;padding-left:.9em;animation:fi 1.4s 1.8s both}
@keyframes fi{from{opacity:0}}
/* inner pages */
.page{max-width:1040px;margin:0 auto;padding:118px 22px 90px}
h1{font:300 clamp(52px,10vw,112px)/1 "Grenze Gotisch",Georgia,serif;color:var(--dust);letter-spacing:.01em}
.sub{color:var(--mute);margin:10px 0 40px}
.note{margin-top:64px;color:var(--mute);font-size:12px;opacity:.7}
.row{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line)}
.row b{font-weight:500;flex:1}
.row em{font-style:normal;color:var(--blue2);font-size:12px;letter-spacing:.2em}
.row small{color:var(--mute)}
.btn{font:500 13px Anuphan,sans-serif;letter-spacing:.2em;color:var(--bone);background:transparent;border:1px solid var(--dust);padding:10px 22px;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:var(--dust);color:var(--ink)}
.btn.b{background:var(--blue);border-color:var(--blue)}
.btn.b:hover{background:var(--blue2);border-color:var(--blue2);color:var(--ink)}
.pb{position:relative;width:34px;height:34px;border:1px solid var(--dust);border-radius:50%;flex:none;cursor:pointer;transition:background .25s}
.pb::before{content:"";position:absolute;left:13px;top:9px;border:8px solid transparent;border-left:12px solid var(--dust);border-right:0}
.pb:hover{background:#c99a5b30}
.eq{display:none;gap:3px;align-items:flex-end;height:16px}
.eq s{width:3px;height:100%;background:var(--blue2);transform-origin:bottom;animation:eq .7s ease-in-out infinite alternate}
.eq s:nth-child(2){animation-delay:.2s}.eq s:nth-child(3){animation-delay:.4s}
.pl .eq{display:flex}
.pl b{color:var(--dust)}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.feat{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;margin-bottom:44px}
.big{font:300 clamp(54px,9vw,110px)/1.05 "Grenze Gotisch",Georgia,serif;color:var(--bone);overflow-wrap:anywhere}
.chip{display:inline-block;margin-top:12px;border:1px solid var(--blue2);color:var(--blue2);font-size:11px;letter-spacing:.3em;padding:3px 12px}
.ros{display:flex;flex-wrap:wrap;gap:6px 22px}
.ros button{font:400 clamp(24px,4vw,34px)/1.3 "Grenze Gotisch",Georgia,serif;color:var(--mute);background:none;border:0;cursor:pointer;padding:2px 0;transition:color .25s,translate .25s}
.ros button:hover{color:var(--bone);translate:0 -2px}
.ros button.on{color:var(--dust);text-shadow:0 0 22px #3347d6}
.next{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;padding:28px;margin-bottom:28px;background:radial-gradient(90% 160% at 100% 100%,#3347d655,#0000 70%),#ffffff08;border:1px solid var(--line)}
.next small{letter-spacing:.3em;color:var(--blue2);font-size:11px}
.cd{display:flex;gap:22px;margin-top:6px}
.cd span{font-size:12px;color:var(--mute)}
.cd b{display:block;font:400 46px/1 "Grenze Gotisch",Georgia,serif;color:var(--bone)}
.news{display:block;padding:24px 4px;border-bottom:1px solid var(--line)}
.news time{font-size:12px;color:var(--mute);letter-spacing:.2em}
.news h3{font:500 22px/1.4 Anuphan,sans-serif;margin:4px 0}
.news p{color:var(--mute);max-width:60ch}
.dt{font:400 54px/1 "Grenze Gotisch",Georgia,serif;color:var(--dust);min-width:92px}
.dt small{display:block;font:500 11px Anuphan,sans-serif;letter-spacing:.3em;color:var(--mute)}
.tk{display:grid;grid-template-columns:1fr 320px;gap:36px;align-items:start}
.opts{display:grid;gap:10px;margin-bottom:26px}
.opt{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border:1px solid var(--line);background:none;color:var(--bone);font:inherit;cursor:pointer;text-align:left;transition:border-color .25s,background .25s}
.opt:hover{border-color:var(--dust)}
.opt.on{border-color:var(--blue2);background:#3347d62e}
.opt small{color:var(--mute)}
h2{font:400 30px/1.2 "Grenze Gotisch",Georgia,serif;color:var(--dust);margin:0 0 12px}
.sum{padding:24px;border:1px solid var(--line);background:#ffffff08;position:sticky;top:90px}
.qty{display:flex;align-items:center;gap:14px;margin:12px 0 20px}
.qty button{width:34px;height:34px;border:1px solid var(--dust);background:none;color:var(--bone);font-size:18px;cursor:pointer}
.tot{font:400 44px/1 "Grenze Gotisch",Georgia,serif;margin:6px 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tabs .opt{flex:1;justify-content:center;padding:10px}
.fld{width:100%;margin-bottom:12px;padding:13px 14px;background:#ffffff0c;border:1px solid var(--line);color:var(--bone);font:inherit}
.fld:focus{border-color:var(--blue2);outline:0}
.perk{padding:12px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:60;max-width:90vw;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--blue);padding:12px 22px;transition:opacity .3s,transform .3s;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.feat,.tk{grid-template-columns:1fr}.sum{position:static}nav{gap:4px 16px}nav a{font-size:10px;letter-spacing:.2em}.dt{font-size:44px;min-width:76px}.row{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const S=[["20","FEB","Bangkok","เวทีกลางแจ้ง","เหลือน้อย"],["13","MAR","Chiang Mai","ไลฟ์เฮาส์","เปิดขายแล้ว"],["04","APR","Khon Kaen","เวทีกลางแจ้ง","เปิดขายแล้ว"],["24","APR","Hat Yai","ไลฟ์เฮาส์","เร็วๆ นี้"]];
const TR=[["Standing",1500,"ยืนหน้าเวที"],["Zone A",2500,"ที่นั่งโซนกลาง"],["VIP",4500,"ทางเข้าพิเศษ ของที่ระลึก"]];
const N=[["07 พ.ย. 2026","D!EOUT ปล่อยทีเซอร์โปรเจกต์ใหม่","ภาพแรกของงานใหม่จากค่าย ติดตามรายละเอียดเร็วๆ นี้"],["01 พ.ย. 2026","ประกาศรอบเปิดขายบัตรทัวร์","สมาชิกแฟนคลับเข้าซื้อได้ก่อนรอบทั่วไป"],["25 ต.ค. 2026","เปิดหน้าสมาชิกแฟนคลับ","สิทธิพิเศษ คอนเทนต์ปิด และโค้ดส่วนลดสำหรับสมาชิก"]];
const R=[["Fan",["สิทธิ์ซื้อบัตรก่อนรอบทั่วไป","โค้ดส่วนลดสินค้าสำหรับสมาชิก","คอนเทนต์ปิด เดโมและเบื้องหลัง","บัตรสมาชิกดิจิทัล"]],["Artist",["โพสต์ข่าวและเพลงของตัวเอง","ดูสถิติแฟนคลับ","ต้องยืนยันตัวตน 2 ขั้นตอน"]],["Admin",["จัดการผู้ใช้ บัตร และออเดอร์","บันทึกประวัติการใช้งานทุกครั้ง","ต้องยืนยันตัวตน 2 ขั้นตอน"]]];
const NOTE='<p class="note">หน้านี้เป็นตัวอย่างดีไซน์ ข้อมูลและวันที่เป็นข้อมูลสมมติ</p>';
let ai=0,st=0,tr=0,q=2,role=0;
$("nav").innerHTML=V.map(v=>`<a href="#${v[0]}">${v[1]}</a>`).join("");

function rA(){const t=[T[ai%9],T[(ai+4)%9]];
$("#artists").innerHTML=`<div class="page"><h1>Artists</h1><p class="sub">13 ศิลปินในค่าย D!EOUT</p>
<div class="feat"><div><div class="big">${A[ai]}</div><span class="chip">COMING SOON</span></div>
<div>${t.map(x=>pr(x,"D!EOUT")).join("")}<div class="row"><i class="pb"></i><b>Untitled</b><em>COMING SOON</em></div></div></div>
<div class="ros">${A.map((a,i)=>`<button data-a="${i}" class="${i==ai?"on":""}">${a}</button>`).join("")}</div>${NOTE}</div>`}
function pr(t,a){return `<div class="row"><i class="pb" data-p></i><b>${t}</b><span class="eq"><s></s><s></s><s></s></span><small>${a}</small></div>`}
function rM(){$("#music").innerHTML=`<div class="page"><h1>Music</h1><p class="sub">เพลงล่าสุดและเพลงที่กำลังจะปล่อย</p>
<div class="next"><div><small>NEXT RELEASE</small><div class="cd" id="cd"></div></div><button class="btn b" data-t="เปิดแจ้งเตือนแล้ว (ตัวอย่าง)">แจ้งเตือนฉัน</button></div>
${T.map(t=>pr(t,"D!EOUT")).join("")}${NOTE}</div>`;cd()}
function cd(){const e=$("#cd");if(!e)return;const d=Math.max(0,new Date("2027-01-01T00:00:00+07:00")-Date.now()),f=(n,l)=>`<span><b>${String(n).padStart(2,"0")}</b>${l}</span>`;
e.innerHTML=f(d/864e5|0,"วัน")+f(d/36e5%24|0,"ชม.")+f(d/6e4%60|0,"นาที")+f(d/1e3%60|0,"วิ")}
function rN(){$("#news").innerHTML=`<div class="page"><h1>News</h1><p class="sub">ข่าวล่าสุดจากค่าย</p>${N.map(n=>`<a class="news"><time>${n[0]}</time><h3>${n[1]}</h3><p>${n[2]}</p></a>`).join("")}${NOTE}</div>`}
function rS(){$("#shows").innerHTML=`<div class="page"><h1>Shows</h1><p class="sub">ตารางโชว์ที่กำลังจะมาถึง</p>${S.map((s,i)=>`<div class="row"><div class="dt">${s[0]}<small>${s[1]}</small></div><b>${s[2]}<br><small>${s[3]}</small></b><em>${s[4]}</em><button class="btn" data-s="${i}">ซื้อบัตร</button></div>`).join("")}${NOTE}</div>`}
function rT(){const t=TR[tr][1]*q;
$("#tickets").innerHTML=`<div class="page"><h1>Tickets</h1><p class="sub">เลือกรอบ ประเภทบัตร และจำนวน</p><div class="tk"><div>
<h2>รอบการแสดง</h2><div class="opts">${S.map((s,i)=>`<button class="opt ${i==st?"on":""}" data-s2="${i}"><span>${s[0]} ${s[1]} ${s[2]}</span><small>${s[4]}</small></button>`).join("")}</div>
<h2>ประเภทบัตร</h2><div class="opts">${TR.map((x,i)=>`<button class="opt ${i==tr?"on":""}" data-r="${i}"><span>${x[0]}<br><small>${x[2]}</small></span><span>฿${x[1].toLocaleString()}</span></button>`).join("")}</div></div>
<div class="sum"><small>${S[st][0]} ${S[st][1]} ${S[st][2]}</small><div class="qty"><button data-q="-1" aria-label="ลด">−</button><b>${q}</b><button data-q="1" aria-label="เพิ่ม">+</button><small>ใบ (สูงสุด 4)</small></div>
<small>ยอดรวม</small><div class="tot">฿${t.toLocaleString()}</div><button class="btn b" style="width:100%" data-t="จองบัตรไว้ 10 นาที (ตัวอย่าง ยังไม่ต่อระบบชำระเงิน)">จองบัตร</button></div></div>${NOTE}</div>`}
function rB(){const r=R[role];
$("#member").innerHTML=`<div class="page"><h1>Member</h1><p class="sub">เข้าสู่ระบบเพื่อรับสิทธิ์สมาชิก</p><div class="tk"><div>
<div class="tabs">${R.map((x,i)=>`<button class="opt ${i==role?"on":""}" data-o="${i}">${x[0]}</button>`).join("")}</div>
<input class="fld" type="email" placeholder="อีเมล" autocomplete="off"><input class="fld" type="password" placeholder="รหัสผ่าน" autocomplete="off">
<button class="btn b" style="width:100%" data-t="ตัวอย่างหน้าเข้าสู่ระบบ ยังไม่ได้เชื่อมระบบจริง">เข้าสู่ระบบ</button></div>
<div><h2>${r[0]}</h2>${r[1].map(x=>`<div class="perk">${x}</div>`).join("")}</div></div>${NOTE}</div>`}

const RN={artists:rA,music:rM,news:rN,shows:rS,tickets:rT,member:rB};
function route(){let h=location.hash.slice(1);if(!V.some(v=>v[0]===h))h="home";
if(RN[h])RN[h]();$$(".view").forEach(v=>v.classList.toggle("on",v.id===h));$$("nav a").forEach(a=>a.classList.toggle("on",a.hash==="#"+h));scrollTo(0,0)}
addEventListener("hashchange",route);route();
let tm;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>e.classList.remove("on"),2600)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a],[data-p],[data-t],[data-s],[data-s2],[data-r],[data-q],[data-o]");if(!b)return;const d=b.dataset;
if(d.a!==undefined){ai=+d.a;rA()}
else if(d.p!==undefined){const r=b.closest(".row"),on=r.classList.contains("pl");$$(".pl").forEach(x=>x.classList.remove("pl"));if(!on)r.classList.add("pl")}
else if(d.s!==undefined){st=+d.s;location.hash="tickets"}
else if(d.s2!==undefined){st=+d.s2;rT()}
else if(d.r!==undefined){tr=+d.r;rT()}
else if(d.q!==undefined){q=Math.min(4,Math.max(1,q+ +d.q));rT()}
else if(d.o!==undefined){role=+d.o;rB()}
else if(d.t)toast(d.t)});
let raf;const hm=$("#home");addEventListener("pointermove",e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;hm.style.setProperty("--px",(e.clientX/innerWidth*2-1).toFixed(3));hm.style.setProperty("--py",(e.clientY/innerHeight*2-1).toFixed(3))})},{passive:true});
setInterval(()=>{if(location.hash==="#music")cd()},1000);
</script>
</body>
</html>
